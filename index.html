<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Studio (Server Powered)</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #2e2e38;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin-top: 40px;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="file"] {
            background: #252529;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed var(--border);
            color: var(--text);
            cursor: pointer;
        }

        input[type="number"] {
            background: #252529;
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 6px;
            color: #fff;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            background: #404040;
            color: #808080;
            cursor: not-allowed;
        }

        .status-box {
            background: #252529;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            min-height: 50px;
            white-space: pre-line;
        }

        .progress-container {
            background: #2d2d34;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Video to ZIP Studio</h1>
    
    <div class="card">
        <div class="form-group">
            <label>Select Video File</label>
            <input type="file" id="videoInput" accept="video/*">
        </div>
        <div class="form-group">
            <label>Extraction Rate (FPS)</label>
            <input type="number" id="fpsInput" value="10" min="1" max="60">
        </div>
        <button id="processBtn">Upload & Process on Server</button>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-box" id="statusText">Ready.</div>
    </div>
</div>

<script>
    const BACKEND_URL = 'https://video-server-private-backend.onrender.com/process';

    document.getElementById('processBtn').addEventListener('click', () => {
        const videoInput = document.getElementById('videoInput');
        const fpsInput = document.getElementById('fpsInput');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const processBtn = document.getElementById('processBtn');

        if (!videoInput.files[0]) {
            alert("Please pick a video file first!");
            return;
        }

        const file = videoInput.files[0];
        const fps = fpsInput.value;

        // Reset UI elements
        processBtn.disabled = true;
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        statusText.textContent = "Preparing file upload...";

        const formData = new FormData();
        formData.append('video', file);
        formData.append('fps', fps);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', BACKEND_URL, true);
        xhr.responseType = 'blob';

        // Track upload progress to the Render server
        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const percent = Math.floor((e.loaded / e.total) * 100);
                progressBar.style.width = percent + '%';
                statusText.textContent = `Uploading video: ${percent}%\n(Don't close this tab)`;
            }
        };

        // Triggered when upload completes and server begins working
        xhr.upload.onload = () => {
            progressBar.style.width = '100%';
            statusText.textContent = "Upload complete! \nServer is slicing frames and creating ZIP file...\nThis may take a minute.";
        };

        // Triggered when the server returns the final ZIP file
        xhr.onload = () => {
            processBtn.disabled = false;
            
            if (xhr.status === 200) {
                statusText.textContent = "Done! Download started.";
                
                // Convert response data into a downloadable browser anchor
                const blob = xhr.response;
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `${file.name.split('.')[0]}_assets.zip`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(downloadUrl);
            } else {
                statusText.textContent = "Error: Server failed to process video file.";
                alert("The server encountered an error processing the video.");
            }
        };

        xhr.onerror = () => {
            processBtn.disabled = false;
            statusText.textContent = "Connection error occurred.";
            alert("Could not connect to the processing server.");
        };

        // Fire the request off to Render
        xhr.send(formData);
    });
</script>

</body>
</html>
