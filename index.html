<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Framework Studio</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #2e2e38;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 900px; }
        h1 { text-align: center; color: #fff; margin-bottom: 30px; }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card h2 { margin: 0 0 10px 0; font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 8px;}

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
        input[type="file"], input[type="number"] {
            background: #252529; border: 1px solid var(--border); padding: 10px; border-radius: 6px; color: #fff;
        }

        button {
            background: var(--accent); color: white; border: none; padding: 12px;
            border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #404040; color: #808080; cursor: not-allowed; }

        .status-box {
            background: #252529; border-radius: 6px; padding: 12px;
            font-family: monospace; font-size: 0.85rem; min-height: 55px; white-space: pre-line;
        }

        .progress-container { background: #2d2d34; border-radius: 10px; height: 10px; width: 100%; overflow: hidden; display: none; }
        .progress-bar { background: var(--accent); height: 100%; width: 0%; transition: width 0.2s ease; }
        .progress-bar.server { background: #10b981; }
    </style>
</head>
<body>

<div class="container">
    <h1>Video & Asset Framework Studio</h1>
    
    <div class="grid">
        <div class="card" id="videoCard">
            <h2>1. Video to ZIP Extractor</h2>
            <div class="form-group">
                <label>Target Video File</label>
                <input type="file" class="file-input" accept="video/*">
            </div>
            <div class="form-group">
                <label>Extraction Framerate (FPS)</label>
                <input type="number" class="fps-input" value="10" min="1" max="60">
            </div>
            <button class="action-btn">Extract & Package ZIP</button>
            <div class="progress-container"><div class="progress-bar"></div></div>
            <div class="status-box">Ready.</div>
        </div>

        <div class="card" id="zipCard">
            <h2>2. ZIP to Video Compiler</h2>
            <div class="form-group">
                <label>Asset ZIP File</label>
                <input type="file" class="file-input" accept=".zip">
            </div>
            <div class="form-group">
                <label>Rebuild Playback Rate (FPS)</label>
                <input type="number" class="fps-input" value="10" min="1" max="60">
            </div>
            <button class="action-btn">Rebuild Video File</button>
            <div class="progress-container"><div class="progress-bar"></div></div>
            <div class="status-box">Ready.</div>
        </div>
    </div>
</div>

<script>
    const BASE_URL = 'https://video-server-private-backend.onrender.com';

    setupCard('videoCard', '/process-video', 'video');
    setupCard('zipCard', '/process-zip', 'zip');

    function setupCard(cardId, endpoint, fieldName) {
        const card = document.getElementById(cardId);
        const fileInput = card.querySelector('.file-input');
        const fpsInput = card.querySelector('.fps-input');
        const button = card.querySelector('.action-btn');
        const pContainer = card.querySelector('.progress-container');
        const pBar = card.querySelector('.progress-bar');
        const status = card.querySelector('.status-box');

        button.addEventListener('click', () => {
            if (!fileInput.files[0]) {
                alert("Please select a target source file first!");
                return;
            }

            button.disabled = true;
            pContainer.style.display = 'block';
            pBar.className = 'progress-bar'; // Reset to standard upload styling
            pBar.style.width = '0%';
            status.textContent = "Connecting to remote deployment...";

            const formData = new FormData();
            formData.append(fieldName, fileInput.files[0]);
            formData.append('fps', fpsInput.value);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `${BASE_URL}${endpoint}`, true);
            xhr.responseType = 'json';

            // 1. Monitor Client Data Upload to Server
            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const pct = Math.floor((e.loaded / e.total) * 100);
                    pBar.style.width = pct + '%';
                    status.textContent = `Uploading raw data asset: ${pct}%`;
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200 && xhr.response?.jobId) {
                    const jobId = xhr.response.jobId;
                    pBar.classList.add('server'); // Turn progress bar green for server operations
                    pollJobStatus(jobId, card);
                } else {
                    resetCard(card, "Upload phase connection configuration rejected.");
                }
            };

            xhr.onerror = () => resetCard(card, "Network transaction failure.");
            xhr.send(formData);
        });
    }

    // 2. Poll Server Job Status Ecosystem
    function pollJobStatus(jobId, card) {
        const pBar = card.querySelector('.progress-bar');
        const status = card.querySelector('.status-box');
        
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${BASE_URL}/job/${jobId}`);
                if (!res.ok) throw new Error();
                const job = await res.json();

                if (job.status === 'processing') {
                    pBar.style.width = job.progress + '%';
                    status.textContent = `Server Engine Status: [${job.stage}]\nProgress: ${job.progress}%`;
                } else if (job.status === 'completed') {
                    clearInterval(interval);
                    pBar.style.width = '100%';
                    status.textContent = "Server jobs complete! Pulling output file sequence...";
                    
                    // Direct Download Trigger Link Generation
                    const a = document.createElement('a');
                    a.href = `${BASE_URL}/download/${jobId}`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    
                    setTimeout(() => resetCard(card, "Task sequence completed cleanly."), 2000);
                } else if (job.status === 'failed') {
                    clearInterval(interval);
                    resetCard(card, "Server engine encountered encoding layout system failures.");
                }
            } catch {
                clearInterval(interval);
                resetCard(card, "Connection tracking pipeline broke.");
            }
        }, 1000);
    }

    function resetCard(card, message) {
        card.querySelector('.action-btn').disabled = false;
        card.querySelector('.status-box').textContent = message;
    }
</script>

</body>
</html>
