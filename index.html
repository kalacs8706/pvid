<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Video Asset Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --local-accent: #f59e0b;
            --local-hover: #d97706;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #2e2e38;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 900px; }
        h1 { text-align: center; color: #fff; margin-bottom: 5px; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card h2 { margin: 0 0 5px 0; font-size: 1.25rem; color: #fff; }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input[type="file"], input[type="number"], select {
            background: #252529; border: 1px solid var(--border); padding: 10px; border-radius: 6px; color: #fff; font-size: 0.95rem;
        }
        select { cursor: pointer; }

        button {
            color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        button.mode-server { background: var(--accent); }
        button.mode-server:hover { background: var(--accent-hover); }
        button.mode-local { background: var(--local-accent); }
        button.mode-local:hover { background: var(--local-hover); }
        button:disabled { background: #404040 !important; color: #808080; cursor: not-allowed; }

        .status-box {
            background: #252529; border: 1px solid var(--border); border-radius: 6px; padding: 12px;
            font-family: monospace; font-size: 0.85rem; min-height: 55px; white-space: pre-line; line-height: 1.4;
        }

        .progress-container { background: #2d2d34; border-radius: 10px; height: 10px; width: 100%; overflow: hidden; display: none; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.1s linear; background: var(--accent); }
        .progress-bar.local-run { background: var(--local-accent); }
        .progress-bar.server-run { background: #10b981; }

        /* Hidden assets for client-side processing */
        #hiddenCanvas, #hiddenVideo { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Hybrid Video Asset Studio</h1>
    <div class="subtitle">Process files instantly in your browser or offload tasks to the cloud</div>
    
    <div class="grid">
        <div class="card" id="videoCard">
            <h2>1. Video to ZIP Extractor</h2>
            <div class="form-group">
                <label>Processing Location</label>
                <select class="engine-select">
                    <option value="local">Local Computer (Fast, uses your RAM)</option>
                    <option value="server">Remote Server (Cloud, saves device battery)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Target Video File</label>
                <input type="file" class="file-input" accept="video/*">
            </div>
            <div class="form-group">
                <label>Extraction Framerate (FPS)</label>
                <input type="number" class="fps-input" value="10" min="1" max="60">
            </div>
            <button class="action-btn mode-local">Extract & Package ZIP</button>
            <div class="progress-container"><div class="progress-bar"></div></div>
            <div class="status-box">Ready.</div>
        </div>

        <div class="card" id="zipCard">
            <h2>2. ZIP to Video Compiler</h2>
            <div class="form-group">
                <label>Processing Location</label>
                <select class="engine-select">
                    <option value="local">Local Computer (Fast, runs in browser)</option>
                    <option value="server">Remote Server (Cloud Engine)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Asset ZIP File</label>
                <input type="file" class="file-input" accept=".zip">
            </div>
            <div class="form-group">
                <label>Rebuild Playback Rate (FPS)</label>
                <input type="number" class="fps-input" value="10" min="1" max="60">
            </div>
            <button class="action-btn mode-local">Rebuild Video File</button>
            <div class="progress-container"><div class="progress-bar"></div></div>
            <div class="status-box">Ready.</div>
        </div>
    </div>
</div>

<canvas id="hiddenCanvas"></canvas>
<video id="hiddenVideo" muted playsinline></video>

<script>
    const SERVER_URL = 'https://video-server-private-backend.onrender.com';

    // UI Engine Toggle Updates Colors & Themes dynamically
    document.querySelectorAll('.engine-select').forEach(select => {
        select.addEventListener('change', (e) => {
            const btn = e.target.closest('.card').querySelector('.action-btn');
            if (e.target.value === 'local') {
                btn.className = "action-btn mode-local";
            } else {
                btn.className = "action-btn mode-server";
            }
        });
    });

    // Setup Event Hooks
    initVideoToZip();
    initZipToVideo();

    // --- HELPER: CALCULATE & FORMAT ETA ---
    function getETAText(startTime, currentItem, totalItems) {
        if (currentItem === 0) return "Calculating ETA...";
        const timeElapsed = Date.now() - startTime;
        const totalEstimatedTime = (timeElapsed / currentItem) * totalItems;
        const msRemaining = totalEstimatedTime - timeElapsed;
        
        if (msRemaining <= 0) return "Finishing up...";
        const seconds = Math.ceil(msRemaining / 1000);
        if (seconds < 60) return `ETA: ${seconds}s`;
        return `ETA: ${Math.floor(seconds / 60)}m ${seconds % 60}s`;
    }

    // --- PIPELINE 1: VIDEO TO ZIP ---
    function initVideoToZip() {
        const card = document.getElementById('videoCard');
        const btn = card.querySelector('.action-btn');

        btn.addEventListener('click', async () => {
            const file = card.querySelector('.file-input').files[0];
            const fps = parseInt(card.querySelector('.fps-input').value) || 10;
            const engine = card.querySelector('.engine-select').value;

            if (!file) return alert("Please select a video file!");

            prepareUI(card);

            if (engine === 'local') {
                runLocalVideoToZip(file, fps, card);
            } else {
                runServerTask(file, fps, card, '/process-video', 'video');
            }
        });
    }

    async function runLocalVideoToZip(file, fps, card) {
        const pBar = card.querySelector('.progress-bar');
        const status = card.querySelector('.status-box');
        pBar.className = "progress-bar local-run";

        status.textContent = "Local Engine: Scanning internal audio components...";
        let audioBlob = null;
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            audioBlob = encodeWAV(audioBuffer);
        } catch(e) { console.log("No extractable audio track discovered."); }

        const video = document.getElementById('hiddenVideo');
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');

        video.src = URL.createObjectURL(file);
        video.onloadedmetadata = async () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const duration = video.duration;
            const totalFrames = Math.floor(duration * fps);
            const interval = 1 / fps;
            
            const zip = new JSZip();
            const frameFolder = zip.folder("frames");
            if (audioBlob) zip.file("audio.wav", audioBlob);

            let currentFrame = 0;
            const startTime = Date.now();

            for (let t = 0; t < duration; t += interval) {
                video.currentTime = t;
                await new Promise(r => video.onseeked = r);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const frameBlob = await new Promise(r => canvas.toBlob(r, 'image/png'));
                frameFolder.file(`${String(currentFrame).padStart(5, '0')}.png`, frameBlob);
                
                currentFrame++;
                const pct = Math.floor((currentFrame / totalFrames) * 100);
                pBar.style.width = pct + '%';
                status.textContent = `Local Processing: Extracting ${currentFrame}/${totalFrames} frames (${pct}%)\n${getETAText(startTime, currentFrame, totalFrames)}`;
            }

            status.textContent = "Local Engine: Packing system files into ZIP...";
            const zipContent = await zip.generateAsync({type: "blob"});
            triggerDownload(zipContent, `${file.name.split('.')[0]}_assets.zip`);
            resetCard(card, "Local extraction successfully completed!");
        };
    }

    // --- PIPELINE 2: ZIP TO VIDEO ---
    function initZipToVideo() {
        const card = document.getElementById('zipCard');
        const btn = card.querySelector('.action-btn');

        btn.addEventListener('click', async () => {
            const file = card.querySelector('.file-input').files[0];
            const fps = parseInt(card.querySelector('.fps-input').value) || 10;
            const engine = card.querySelector('.engine-select').value;

            if (!file) return alert("Please select a ZIP file!");

            prepareUI(card);

            if (engine === 'local') {
                runLocalZipToVideo(file, fps, card);
            } else {
                runServerTask(file, fps, card, '/process-zip', 'zip');
            }
        });
    }

    async function runLocalZipToVideo(file, fps, card) {
        const pBar = card.querySelector('.progress-bar');
        const status = card.querySelector('.status-box');
        pBar.className = "progress-bar local-run";

        status.textContent = "Local Engine: Unpacking archive maps...";
        const zip = await JSZip.loadAsync(file);
        const frameFiles = [];
        
        zip.folder("frames").forEach((path, obj) => {
            if (path.endsWith('.png')) frameFiles.push(obj);
        });
        frameFiles.sort((a,b) => a.name.localeCompare(b.name));

        if (frameFiles.length === 0) return resetCard(card, "Failure: No frame graphics found inside zip.");

        const firstImgBlob = await frameFiles[0].async("blob");
        const imgEl = await loadImgAsync(URL.createObjectURL(firstImgBlob));
        
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = imgEl.width;
        canvas.height = imgEl.height;

        const stream = canvas.captureStream(fps);
        let options = { mimeType: 'video/webm;codecs=vp9' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/mp4' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: '' };

        const recorder = new MediaRecorder(stream, options);
        const chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.start();

        const startTime = Date.now();

        for (let i = 0; i < frameFiles.length; i++) {
            const blob = await frameFiles[i].async("blob");
            const url = URL.createObjectURL(blob);
            const img = await loadImgAsync(url);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            URL.revokeObjectURL(url);

            await new Promise(r => setTimeout(r, 1000 / fps));

            const pct = Math.floor(((i + 1) / frameFiles.length) * 100);
            pBar.style.width = pct + '%';
            status.textContent = `Local Rendering: Painting frame ${i+1}/${frameFiles.length} (${pct}%)\n${getETAText(startTime, i + 1, frameFiles.length)}`;
        }

        recorder.onstop = () => {
            const outBlob = new Blob(chunks, { type: recorder.mimeType || 'video/mp4' });
            triggerDownload(outBlob, 'rebuilt_video.mp4');
            resetCard(card, "Local compilation complete!");
        };
        recorder.stop();
    }

    // --- SERVER OPERATION HANDLER ---
    function runServerTask(file, fps, card, endpoint, fieldName) {
        const pBar = card.querySelector('.progress-bar');
        const status = card.querySelector('.status-box');
        pBar.className = "progress-bar";

        const formData = new FormData();
        formData.append(fieldName, file);
        formData.append('fps', fps);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', `${SERVER_URL}${endpoint}`, true);
        xhr.responseType = 'json';

        const uploadStartTime = Date.now();

        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const pct = Math.floor((e.loaded / e.total) * 100);
                pBar.style.width = pct + '%';
                status.textContent = `Uploading File: ${pct}%\n${getETAText(uploadStartTime, e.loaded, e.total)}`;
            }
        };

        xhr.upload.onload = () => {
            pBar.className = "progress-bar server-run";
            pBar.style.width = '0%';
            status.textContent = "Server received package.\nAwakening processor engines...";
        };

        xhr.onload = () => {
            if (xhr.status === 200 && xhr.response?.jobId) {
                pollServerJob(xhr.response.jobId, card);
            } else {
                resetCard(card, "Cloud server setup tracking failed.");
            }
        };

        xhr.onerror = () => resetCard(card, "Server communication pipeline lost.");
        xhr.send(formData);
    }

    function pollServerJob(jobId, card) {
        const pBar = card.querySelector('.progress-bar');
        const status = card.querySelector('.status-box');
        const serverStartTime = Date.now();

        const poller = setInterval(async () => {
            try {
                const res = await fetch(`${SERVER_URL}/job/${jobId}`);
                if (!res.ok) throw new Error();
                const job = await res.json();

                if (job.status === 'processing') {
                    pBar.style.width = job.progress + '%';
                    status.textContent = `Cloud Status: [${job.stage}]\nProgress: ${job.progress}%\n${getETAText(serverStartTime, job.progress, 100)}`;
                } else if (job.status === 'completed') {
                    clearInterval(poller);
                    pBar.style.width = '100%';
                    status.textContent = "Processing clear! Directing download pipe...";
                    
                    triggerDownload(`${SERVER_URL}/download/${jobId}`, null, true);
                    setTimeout(() => resetCard(card, "Server task sequence closed cleanly."), 2000);
                } else if (job.status === 'failed') {
                    clearInterval(poller);
                    resetCard(card, "Cloud error: Compilation crash.");
                }
            } catch {
                clearInterval(poller);
                resetCard(card, "Error tracking live job states.");
            }
        }, 1000);
    }

    // --- STRUCTURAL CORE PLATFORM UTILITIES ---
    function prepareUI(card) {
        card.querySelector('.action-btn').disabled = true;
        card.querySelector('.progress-container').style.display = 'block';
    }

    function resetCard(card, msg) {
        card.querySelector('.action-btn').disabled = false;
        card.querySelector('.status-box').textContent = msg;
    }

    function triggerDownload(target, defaultName, isDirectLink = false) {
        const a = document.createElement('a');
        if (isDirectLink) {
            a.href = target;
        } else {
            a.href = URL.createObjectURL(target);
            a.download = defaultName;
        }
        document.body.appendChild(a);
        a.click();
        a.remove();
        if(!isDirectLink) URL.revokeObjectURL(a.href);
    }

    function loadImgAsync(url) {
        return new Promise((res, rej) => {
            const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url;
        });
    }

    // --- NATIVE BINARY PCM AUDIO TO WAV ENCODER ---
    function encodeWAV(audioBuffer) {
        const numOfChan = audioBuffer.numberOfChannels, sampleRate = audioBuffer.sampleRate, format = 1, bitDepth = 16;
        let result = numOfChan === 2 ? interleave(audioBuffer.getChannelData(0), audioBuffer.getChannelData(1)) : audioBuffer.getChannelData(0);
        const buffer = new ArrayBuffer(44 + result.length * 2), view = new DataView(buffer);
        
        const writeStr = (v, o, s) => { for (let i=0; i<s.length; i++) v.setUint8(o+i, s.charCodeAt(i)); };
        writeStr(view, 0, 'RIFF'); view.setUint32(4, 36 + result.length * 2, true); writeStr(view, 8, 'WAVE');
        writeStr(view, 12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, format, true);
        view.setUint16(22, numOfChan, true); view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * numOfChan * (bitDepth / 8), true); view.setUint16(32, numOfChan * (bitDepth / 8), true);
        view.setUint16(34, bitDepth, true); writeStr(view, 36, 'data'); view.setUint32(40, result.length * 2, true);
        
        for (let i = 0; i < result.length; i++) {
            let s = Math.max(-1, Math.min(1, result[i]));
            view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return new Blob([view], { type: 'audio/wav' });
    }

    function interleave(inputL, inputR) {
        const length = inputL.length + inputR.length, result = new Float32Array(length);
        let index = 0, inputIndex = 0;
        while (index < length) { result[index++] = inputL[inputIndex]; result[index++] = inputR[inputIndex]; inputIndex++; }
        return result;
    }
</script>

</body>
</html>
